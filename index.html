<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oscar Minj | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="header">
  <div class="container nav">
    <h2 class="logo">oscarminj</h2>
    <nav>
      <a href="#about">About</a>
      <a href="#education">Education</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#coursework">Coursework</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <h1 id="name"></h1>
      <p id="headline" class="headline"></p>
      <p id="summary" class="summary"></p>
      <div class="buttons">
        <a href="#contact" class="btn primary">Contact</a>
        <a href="#projects" class="btn secondary">Projects</a>
      </div>
    </div>
    <div class="card">
      <h3>Quick Info</h3>
      <ul id="quickFacts"></ul>
    </div>
  </div>
</section>

<section id="about" class="section">
  <div class="container">
    <h2>About</h2>
    <p id="aboutText"></p>
  </div>
</section>

<section id="education" class="section alt">
  <div class="container">
    <h2>Education</h2>
    <div id="educationList" class="grid"></div>
  </div>
</section>

<section id="projects" class="section">
  <div class="container">
    <h2>Projects</h2>
    <div id="projectList" class="grid"></div>
  </div>
</section>

<section id="skills" class="section alt">
  <div class="container">
    <h2>Skills</h2>
    <div id="skillsList" class="skills"></div>
  </div>
</section>

<section id="coursework" class="section">
  <div class="container">
    <h2>Coursework</h2>
    <div id="courseList" class="grid"></div>
  </div>
</section>

<section id="experience" class="section alt">
  <div class="container">
    <h2>Experience</h2>
    <div id="experienceList" class="grid"></div>
  </div>
</section>

<section id="contact" class="section">
  <div class="container">
    <h2>Contact</h2>
    <div id="contactInfo"></div>
  </div>
</section>

<footer>
  <p id="footerText"></p>
</footer>

<script src="script.js"></script>
</body>
</html>
